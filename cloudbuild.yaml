# Google Cloud Build configuration for automated deployment
steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/piehands-crm-backend:$COMMIT_SHA',
      '-t', 'gcr.io/$PROJECT_ID/piehands-crm-backend:latest',
      '.'
    ]
    dir: 'backend'

  # Push Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/piehands-crm-backend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/piehands-crm-backend:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', 'piehands-crm-backend',
      '--image', 'gcr.io/$PROJECT_ID/piehands-crm-backend:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '8080',
      '--memory', '2Gi',
      '--cpu', '2',
      '--max-instances', '10',
      '--set-env-vars', 'NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID',
      '--set-secrets', 'DATABASE_URL=CRM_DATABASE_URL:latest,SENDGRID_API_KEY=SENDGRID_API_KEY:latest,SENDGRID_FROM_EMAIL=SENDGRID_FROM_EMAIL:latest,SENDGRID_FROM_NAME=SENDGRID_FROM_NAME:latest,JWT_SECRET=JWT_SECRET:latest'
    ]

# Store build artifacts
artifacts:
  images:
    - 'gcr.io/$PROJECT_ID/piehands-crm-backend:$COMMIT_SHA'
    - 'gcr.io/$PROJECT_ID/piehands-crm-backend:latest'

# Build configuration
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
